[project]
name = "open-run-lab"
dynamic = ["readme", "version"]
license = "Apache-2.0"
description = "OpenRunLab: a fully local tracking and visualization library for AI training."
requires-python = ">=3.9"
authors = [
    { name = "OpenRunLab Contributors" },
]
keywords = [
    "machine learning",
    "experiment tracking",
    "visualization",
    "local-first"
]

classifiers = [
    'Development Status :: 3 - Alpha',
    'License :: OSI Approved :: Apache Software License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'Topic :: Scientific/Engineering :: Visualization',
]

dependencies = [
    "urllib3>=1.26.0",
    "requests>=2.28.0",
    "setuptools",
    "click",
    "pyyaml",
    "psutil>=5.0.0",
    "nvidia-ml-py",
    "pydantic~=2.0",
    "pyecharts>=2.0.0",
    "wrapt>=1.17.0",
    "platformdirs>=4.2.0",
    "protobuf>=6.31.1,!=6.31.0,<7; python_version == '3.9' and sys_platform == 'linux'",
    "protobuf>=6.31.1,!=6.31.0,<7; python_version > '3.9' and sys_platform == 'linux'",
    "protobuf>=6.31.1,!=6.31.0,<7; sys_platform != 'linux'",
    "rich>=13.6.0",
    "pydantic-settings>=2.8.1",
    "orjson<=3.11.5; python_version == '3.9'",
    "orjson; python_version > '3.9'",
    "watchdog",
    "pwinput>=1.0.3",
    "pyroaring>=1.0.0,<1.0.4; python_version < '3.14'",
    "pyroaring>=1.0.4; python_version >= '3.14'",
]

# 对应 requirements-media.txt [cite: 3]
[project.optional-dependencies]
media = [
    "soundfile",
    "pillow",
    "matplotlib",
    "numpy",
    "moviepy",
    "imageio[ffmpeg]",
    "rdkit>=2025.9.6; python_version > '3.9'",
    "rdkit<=2023.9.6; python_version == '3.9'",
]

[dependency-groups]
dev = [
    "build",
    "pytest",
    "pytest-mock",
    "pytest-benchmark",
    "nanoid",
    "omegaconf",
    "ipython",
    "ipykernel",
    "torch>=2.5.0",
    "torchvision>=0.12.0",
    "pandas",
    "python-dotenv",
    "freezegun",
    "responses",
    "mmengine",
    "grpcio-tools",
    "wandb",
    "ruff>=0.15.4",
    "pre-commit>=3.5.0",
    "scikit-learn",
    "basedpyright>=1.39.5",
]

[project.scripts]
orlab = "open_run_lab.cli:cli"

[project.urls]
"Homepage" = "https://github.com/open-run-lab/open-run-lab"
"Source" = "https://github.com/open-run-lab/open-run-lab"
"Bug Reports" = "https://github.com/open-run-lab/open-run-lab/issues"
"Documentation" = "https://github.com/open-run-lab/open-run-lab/tree/main/docs"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=22.5.0"]
build-backend = "hatchling.build"


[tool.hatch.version]
path = "open_run_lab/package.json"
pattern = ".*\"version\":\\s*\"(?P<version>[^\"]+)\""

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = "(?:\\./)?(readme_files)/"
replacement = 'https://raw.githubusercontent.com/open-run-lab/open-run-lab/main/\g<1>/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = "README_EN.md"
replacement = 'https://github.com/open-run-lab/open-run-lab/blob/main/README_EN.md'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = "CONTRIBUTING.md"
replacement = "https://github.com/open-run-lab/open-run-lab/blob/main/CONTRIBUTING.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = "README.md"
replacement = "https://github.com/open-run-lab/open-run-lab/blob/main/README.md"

[tool.basedpyright]
pythonVersion = "3.9"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = [
    "open_run_lab",
    "tests"
]
ignore = [
    "open_run_lab/proto",
    "open_run_lab/integration"
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
    "**/.ruff_cache",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/dist",
    "**/build",
    "**/*.egg-info",
]
extraPaths = ["."]

[tool.ruff]
exclude = [
    "open_run_lab/proto",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pycache__",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 120
indent-width = 4
target-version = "py39"


[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default, and isort (`I`).
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py", "bench_*.py"]
python_functions = "test_*"
python_classes = "Test*"
