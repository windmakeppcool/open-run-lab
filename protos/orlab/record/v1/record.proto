syntax = "proto3";

package orlab.record.v1;

import "google/protobuf/timestamp.proto";
import "orlab/run/v1/run.proto";
import "orlab/metric/data/v1/data.proto";
import "orlab/metric/column/v1/column.proto";
import "orlab/terminal/v1/log.proto";
import "orlab/save/v1/save.proto";

option go_package = "github.com/open-run-lab/open-run-lab/core/proto/orlab/record/v1;recordv1";

// 所有消息的顶层信封。
//
// OpenRunLab 的运行日志以 append-only 的方式写入磁盘，每条写入均为一个 Record。
// num 字段保证全局单调递增，可用于重放和断点续传。
//
// 消息流示意：
//   init()  → StartRecord, MetadataRecord, ConfigRecord
//   log()   → MetricRecord（每个 key 一条）
//   stdout  → LogRecord（每行一条）
//   finish()→ FinishRecord
message Record {
    // 单调递增序号，由Core构建，用于缓冲区去重，约定：
    // 1. StartRecord 的 num 为-1
    // 2. FinishRecord 的 num 为-2
    // 3. config save 的 num 为-3
    // 4. metadata save 的 num 为-4
    // 5. requirements save 的 num 为-5
    // 6. conda save 的 num 为-6
    // 上述记录为全局唯一、去重Record，其余Record 的 num 为 1 开始的递增序号，小于-100的负数范围被用于特殊场景，例如sync时自动构建column record
    int64 num = 1;
    // Record 生成时间，仅作参考
    google.protobuf.Timestamp timestamp = 2;

    oneof record_type {
        // ── Run 生命周期 ──
        orlab.run.v1.StartRecord start   = 10;
        orlab.run.v1.FinishRecord finish = 11;

        // ── 用户数据 ──
        orlab.metric.column.v1.ColumnRecord column = 12;
        orlab.metric.data.v1.ScalarRecord scalar   = 13;
        orlab.metric.data.v1.MediaRecord media     = 14;
        orlab.metric.data.v1.HistogramRecord histogram = 21;

        // ── 终端输出 ──
        orlab.terminal.v1.LogRecord log = 16;

        // ── 文件保存 ──
        orlab.save.v1.SaveRecord save = 20;
    }
}
